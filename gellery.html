<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="AURELIA Coffee & Patisserie - A luxurious destination for handcrafted coffee, pastries and unforgettable moments.">

    <title>AURELIA | Coffee & Patisserie</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <nav class="navbar container">

            <a href="#home" class="logo">
                AURELIA
                <span>COFFEE & PATISSERIE</span>
            </a>

            <button class="menu-toggle" aria-label="Open navigation menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#about">Our Story</a></li>
                <li><a href="#menu">Menu</a></li>
                <li><a href="#gallery">Gallery</a></li>
                <li><a href="#reviews">Reviews</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>

            <a href="#reservation" class="nav-button">
                Reserve a Table
            </a>

        </nav>

    </header>


    <!-- MAIN -->

    <main>

        <!-- GALLERY -->

        <section class="gallery section" id="gallery">

            <div class="container">

                <div class="section-heading reveal">

                    <p class="eyebrow dark">A GLIMPSE INSIDE</p>

                    <h2>
                        Moments at
                        <span>Aurelia.</span>
                    </h2>

                </div>


                <div class="gallery-grid">

                    <figure class="gallery-item gallery-large reveal">
                        <img src="images/galley1.jpg" width="400"
                            alt="Luxury cafe interior">
                        <figcaption>Coffee & Conversations</figcaption>
                    </figure>


                    <figure class="gallery-item reveal">
                        <img src="images/gallery3.jpg" width="400"
                             alt="Fresh coffee">
                        <figcaption>Freshly Brewed</figcaption>
                    </figure>


                    <figure class="gallery-item reveal">
                        <img src="images/pastries2.jpg" width="400"
                            alt="Fresh pastry">
                        <figcaption>Handcrafted Pastries</figcaption>
                    </figure>


                    <figure class="gallery-item reveal">
                        <img src="images/coffe3.jpg" width="400"
                            alt="Coffee being prepared">
                        <figcaption>The Art of Coffee</figcaption>
                    </figure>


                    <figure class="gallery-item reveal">
                        <img src="images/cafe table.jpg" width="400"
                            alt="Cafe table">
                        <figcaption>Slow Mornings</figcaption>
                    </figure>

                </div>

            </div>

        </section>


       


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
